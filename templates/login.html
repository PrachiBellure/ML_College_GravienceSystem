{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold text-center mb-4">Grievance Portal Sign In</h4>
                <form method="POST">
                    <div class="mb-3"><label class="form-label small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus></div>
                    <div class="mb-3"><label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required></div>
                    <div class="mb-4"><label class="form-label small fw-semibold">Role</label>
                    <select name="role" class="form-select">
                        <option value="student">Student</option>
                        <option value="admin">Administrator</option>
                    </select></div>
                    <button class="btn btn-primary w-100 fw-semibold">Sign In</button>
                </form>
                <div class="mt-4 text-center">
                    <p class="mb-1 small text-muted">Don't have an account or want to use your own?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-success btn-sm w-100 fw-semibold">+ Create New Account / Register</a>
                </div>
                <div class="mt-3 text-muted small text-center border-top pt-2">
                    Default demo logins: <code>admin</code> / <code>Admin@123</code> &bull; <code>student</code> / <code>Student@123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
