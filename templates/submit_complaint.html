{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-3">Lodge a Complaint</h5>
            <form method="POST">
                <div class="mb-3"><label class="form-label fw-semibold">Title</label><input type="text" name="title" class="form-control" placeholder="E.g., Wi-Fi not working" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Location / Room</label><input type="text" name="location" class="form-control" placeholder="E.g., Block B, 2nd Floor" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Complaint Description</label><textarea name="description" rows="4" class="form-control" placeholder="Provide full details. The ML system will categorize this automatically." required></textarea></div>
                <button type="submit" class="btn btn-primary fw-semibold">Submit</button>
                <a href="{{ url_for('student_dashboard') }}" class="btn btn-link text-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
