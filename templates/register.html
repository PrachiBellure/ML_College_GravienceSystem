{% extends 'base.html' %}
{% block title %}Register - Grievance Portal{% endblock %}
{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold text-center mb-4">Create New Account</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Choose Username</label>
                        <input type="text" name="username" class="form-control" placeholder="E.g., your name or teacher name" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Choose Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Any password you like" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Register As</label>
                        <select name="role" class="form-select" required>
                            <option value="student">Student</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-semibold">Register & Create Account</button>
                </form>
                <div class="mt-3 text-center small">
                    Already have an account? <a href="{{ url_for('login') }}">Sign In here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
